<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generative Art</title>
    <script src="https://unpkg.com/htmx.org@1.5.0"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0d0d0d;
        --surface: #161616;
        --border: #2a2a2a;
        --text: #f0ede8;
        --muted: #666;
        --accent: #f0ede8;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 20px 64px;
      }

      header {
        text-align: center;
        margin-bottom: 48px;
      }

      header h1 {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 300;
        font-size: clamp(2rem, 5vw, 3.5rem);
        letter-spacing: -0.02em;
        color: var(--text);
      }

      header p {
        margin-top: 12px;
        font-size: 0.85rem;
        font-weight: 300;
        color: var(--muted);
        max-width: 400px;
        line-height: 1.6;
      }

      /* Canvas frame — the signature element */
      #image-update-div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        width: 100%;
        max-width: 700px;
      }

      .canvas-frame {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px #1a1a1a,
          0 0 40px 4px rgba(240, 237, 232, 0.04),
          0 0 80px 12px rgba(240, 237, 232, 0.02);
        transition: box-shadow 0.4s ease;
      }

      .canvas-frame:hover {
        box-shadow:
          0 0 0 1px #2a2a2a,
          0 0 60px 8px rgba(240, 237, 232, 0.07),
          0 0 120px 20px rgba(240, 237, 232, 0.03);
      }

      .canvas-frame img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* Controls */
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .btn {
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.8rem;
        font-weight: 400;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        padding: 12px 24px;
        transition:
          opacity 0.2s,
          background 0.2s;
        text-decoration: none;
        display: inline-block;
      }

      .btn-primary {
        background: var(--text);
        color: #0d0d0d;
      }

      .btn-primary:hover {
        opacity: 0.85;
      }

      .btn-ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }

      .btn-ghost:hover {
        color: var(--text);
        border-color: #444;
      }

      /* htmx loading state */
      .canvas-frame img.htmx-request {
        opacity: 0.4;
        transition: opacity 0.2s;
      }

      footer {
        margin-top: 64px;
        font-size: 0.75rem;
        color: #333;
        text-align: center;
      }

      footer a {
        color: #444;
        text-decoration: none;
      }
      footer a:hover {
        color: var(--muted);
      }

      @media (max-width: 480px) {
        .controls {
          flex-direction: column;
          width: 100%;
        }
        .btn {
          width: 100%;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Generative Art</h1>
      <p>
        Each piece is unique and unrepeatable. Keep what you love, discard the
        rest.
      </p>
    </header>

    <div id="image-update-div">
      <div class="canvas-frame">
        <img
          id="new-image"
          src="data:image/png;base64,{{image}}"
          alt="Generated artwork"
        />
      </div>

      <div class="controls">
        <a
          class="btn btn-primary"
          download="art.png"
          href="data:image/png;base64,{{image}}"
        >
          Download
        </a>
        <button
          class="btn btn-ghost"
          hx-target="#image-update-div"
          hx-get="/generate-another"
          hx-swap="outerHTML"
        >
          Generate another
        </button>
      </div>
    </div>

    <footer>
      <p>
        Built with Pillow &amp; Flask —
        <a href="https://codecapsules.io/docs/tutorials/generative-art/"
          >read the tutorial</a
        >
      </p>
    </footer>
  </body>
</html>
